name: Build Brahma APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Android APK
        run: |
          flutter config --no-analytics
          flutter create --org com.brahma --project-name brahma app_temp
          cp lib/main.dart app_temp/lib/main.dart
          cp pubspec.yaml app_temp/pubspec.yaml
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' app_temp/android/app/build.gradle || true
          cd app_temp
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brahma-LifeOS-APK
          path: app_temp/build/app/outputs/flutter-apk/app-debug.apk

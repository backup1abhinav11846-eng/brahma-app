name: Build Brahma APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Fresh Flutter App & Build APK
        run: |
          # 1. Create a clean Flutter project structure
          flutter create --org com.brahma brahma_flutter_app
          
          # 2. Inject our Brahma main.dart and pubspec.yaml into it
          cp lib/main.dart brahma_flutter_app/lib/main.dart
          cp pubspec.yaml brahma_flutter_app/pubspec.yaml
          
          # 3. Navigate into the folder, fetch packages & build APK
          cd brahma_flutter_app
          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brahma-LifeOS-APK
          path: brahma_flutter_app/build/app/outputs/flutter-apk/app-debug.apk
